[package]
name = "arc_shell"
version = "1.0.0"
description = "Arc in the Windows 11 Explorer context menu (IExplorerCommand)"
license = "MIT"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
